name: Detector tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run all tests (synthetic inputs only)
        run: python -m unittest discover -s tests -t . -v
      - name: Try each standalone script on synthetic data
        run: |
          python ghost.py --lms examples/synthetic/lms.csv --video examples/synthetic/video.csv --calendar examples/synthetic/calendar.csv
          python zombie.py --lms examples/synthetic/lms.csv --video examples/synthetic/video.csv
          python vampire.py --lms examples/synthetic/lms.csv --video examples/synthetic/video.csv
