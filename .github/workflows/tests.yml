name: Detector tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run all tests (synthetic inputs only)
        run: python -m unittest discover -s tests -t . -v
      - name: Try each standalone script on synthetic data
        run: |
          python zombie.py --lms examples/all_monsters/lms.csv --video examples/all_monsters/video.csv
          python phantom.py --lms examples/all_monsters/lms.csv --video examples/all_monsters/video.csv
          python ghost.py --lms examples/all_monsters/lms.csv --video examples/all_monsters/video.csv --calendar examples/all_monsters/calendar.csv
          python vampire.py --lms examples/all_monsters/lms.csv --video examples/all_monsters/video.csv
          python undead_student.py --lms examples/all_monsters/lms.csv --video examples/all_monsters/video.csv --persons examples/all_monsters/persons.csv
          python doppelganger.py --lms examples/all_monsters/lms.csv --video examples/all_monsters/video.csv
          python werewolf.py --lms examples/all_monsters/lms.csv --video examples/all_monsters/video.csv --calendar examples/all_monsters/calendar.csv
          python web_crawler.py --lms examples/all_monsters/lms.csv --video examples/all_monsters/video.csv
          python shape_shifter.py --programme-history examples/all_monsters/programme_history.csv --calendar examples/all_monsters/calendar.csv
